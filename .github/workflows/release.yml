name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Run tests
        run: go test -race ./...


  build:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,  goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64 }
          - { runner: macos-latest,     goos: darwin, goarch: arm64 }
          # darwin-amd64 (Intel Mac) CLI build dropped at v7.0.0:
          # GitHub-hosted macos-13 runners (last Intel Mac image) deprecated
          # by GitHub, scheduling priority lowered, jobs queue 30+ min during
          # peak hours. Apple Silicon now ~95%+ of dev Mac fleet. Intel users
          # can stay on v6.2.1 or request a v7.0.x patch with hand-built
          # darwin-amd64 artifact uploaded via `gh release upload`.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.3'

      - name: Install Rust toolchain (embedding sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (embedding sidecar)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            embed-sidecar/target
          key: ${{ runner.os }}-${{ matrix.goarch }}-embed-cargo-${{ hashFiles('embed-sidecar/Cargo.lock') }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Defense in depth: regenerate the embedded FPF SQLite index from the
      # current submodule SHA. The committed internal/cli/fpf.db should
      # already match, but a developer who forgot to run `task fpf-refresh`
      # before tagging would otherwise ship a stale corpus to users.
      - name: Rebuild FPF index from submodule
        run: |
          go run ./cmd/indexer \
            data/FPF/FPF-Spec.md \
            internal/cli/fpf.db \
            "$(git -C data/FPF rev-parse HEAD)"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/m0n0x41d/haft/internal/cli.Version=${{ steps.version.outputs.version }} \
              -X github.com/m0n0x41d/haft/internal/cli.Commit=$(git rev-parse --short HEAD) \
              -X github.com/m0n0x41d/haft/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o haft ./cmd/haft/

      - name: Build Open-Sleigh runtime
        run: |
          cd open-sleigh
          MIX_ENV=prod mix deps.get --only prod
          MIX_ENV=prod mix release --overwrite

      # Optional embedding sidecar (haft-embed). ort statically links onnxruntime
      # so the output is a single self-contained binary (no libonnxruntime to
      # ship). continue-on-error: embeddings are OPTIONAL — a sidecar build
      # failure must not block the release; search degrades to FTS5+PPR and
      # install.sh can still source-build it where cargo is present.
      - name: Build embedding sidecar
        id: embed
        continue-on-error: true
        run: |
          cd embed-sidecar
          rm -f target/release/haft-embed
          cargo build --release

      - name: Package
        run: |
          mkdir -p _dist
          mkdir -p runtimes/open-sleigh
          cp -R open-sleigh/_build/prod/rel/open_sleigh/. runtimes/open-sleigh/
          mkdir -p runtimes/haft-embed/bin
          sidecar_path=embed-sidecar/target/release/haft-embed
          if [ "${{ steps.embed.outcome }}" = "success" ] && [ -x "$sidecar_path" ]; then
            cp "$sidecar_path" runtimes/haft-embed/bin/haft-embed
            echo "bundled haft-embed sidecar ($(du -h "$sidecar_path" | cut -f1))"
          else
            echo "::warning::haft-embed sidecar not built for ${{ matrix.goos }}-${{ matrix.goarch }} — semantic recall will fall back to FTS5+PPR or install.sh source build"
          fi
          tar czf _dist/haft-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            haft runtimes README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: haft-${{ matrix.goos }}-${{ matrix.goarch }}
          path: _dist/*.tar.gz

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd _artifacts && sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Haft ${{ github.ref_name }}" \
            --generate-notes \
            _artifacts/*
