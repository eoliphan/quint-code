# Bun config for @haft/tui.
# Preload @opentui/solid's transform plugin so SolidJS JSX compiles
# into OpenTUI Renderable nodes during bun run / bun build / bun test.
preload = ["@opentui/solid/preload"]

# Production install only; no auto-install (CI / release pipelines should
# rely on the committed bun.lockb for reproducibility).
[install]
auto = "disable"

[test]
preload = ["@opentui/solid/preload"]
